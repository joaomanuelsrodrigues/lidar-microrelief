[project]
name = "microrelief"
version = "0.2.0"
description = "Microrelief from raw airborne LiDAR: DTM, DSM and CHM that declare what each cell is made of"
requires-python = ">=3.12"
dependencies = [
    "laspy[lazrs]>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "requests>=2.31",
]

[project.optional-dependencies]
site = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
microrelief = "microrelief.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "affine.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "laspy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

# rasterio ships no py.typed marker, so strict mode refuses the import outright.
[[tool.mypy.overrides]]
module = "rasterio.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
