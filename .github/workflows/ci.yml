name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -q
      - name: neutrality
        run: |
          set -e
          # generic classes only; the private-name list is enforced upstream
          ! grep -rInE '/home/[a-z]+/|C:\\\\Users\\\\' --include='*.py' --include='*.md' . || exit 1
          ! grep -rInE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' --include='*.py' --include='*.md' . || exit 1
          test ! -f .env
