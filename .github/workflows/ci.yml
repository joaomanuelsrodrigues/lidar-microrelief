name: ci
on: [push, pull_request]
# Least privilege: this workflow only reads the tree and runs gates. Declared
# explicitly rather than inherited, so a later repo-settings change cannot
# silently widen it.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, not tags. A tag is mutable: whoever
      # controls the action's repo can move `v4` to a different commit, and every run
      # here would execute it before any gate of ours runs. The trailing comment is
      # the human-readable version the SHA was verified against.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - run: uv sync --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy
      - run: uv run pytest -q
      - name: neutrality
        run: |
          set -euo pipefail
          # Tracked files only: the constraint is about what the repository
          # contains, not what the working directory happens to hold.
          # (`uv sync` above populates .venv with third-party docstrings that
          #  legitimately contain example home paths.)
          check() {
            hits=$(git ls-files -z '*.py' '*.md' | xargs -0 -r grep -nIE "$1" || true)
            [ -z "$hits" ] || { echo "$2"; echo "$hits"; exit 1; }
          }
          # A username is not lowercase-only: `/home/[a-z]+/` silently misses any
          # account whose name carries a digit, which is the very path this check
          # exists to keep out of the tree. The character class matches what a
          # POSIX account name can actually be.
          check '/home/[A-Za-z0-9._-]+/|C:\\+Users\\+' 'private path leak:'
          check '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' 'e-mail leak:'
          test ! -f .env
