name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -q
      - name: neutrality
        run: |
          set -euo pipefail
          # Tracked files only: the constraint is about what the repository
          # contains, not what the working directory happens to hold.
          # (`uv sync` above populates .venv with third-party docstrings that
          #  legitimately contain example home paths.)
          check() {
            hits=$(git ls-files -z '*.py' '*.md' | xargs -0 -r grep -nIE "$1" || true)
            [ -z "$hits" ] || { echo "$2"; echo "$hits"; exit 1; }
          }
          check '/home/[a-z]+/|C:\\+Users\\+' 'private path leak:'
          check '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' 'e-mail leak:'
          test ! -f .env
